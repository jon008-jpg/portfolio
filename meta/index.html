<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Jocelyn Ng</title>
    <link rel="stylesheet" href="../style.css">
    
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <section>
        <h2>Summary</h2>
        <div id="stats"></div>
    </section>

    <section id="scrolling-analysis">
        <h2>Commits By Time of Day</h2>
        
        <div id="scrolly-1">
            <div id="scatter-story">
                </div>
            
            <div id="scatter-plot">
                <p id="selection-count">No commits selected</p>
                <dl id="language-breakdown" class="stats"></dl>

                <div id="chart"></div>
                
                <dl id="commit-tooltip" class="info tooltip" hidden>
                    <dt>Commit</dt>
                    <dd><a href="" id="commit-link" target="_blank"></a></dd>

                    <dt>Date</dt>
                    <dd id="commit-date"></dd>

                    <dt>Time</dt>
                    <dd id="commit-time-tooltip"></dd> 
                    
                    <dt>Author</dt>
                    <dd id="commit-author"></dd>

                    <dt>Lines Edited</dt>
                    <dd id="commit-lines"></dd>
                </dl>
            </div>
        </div>
    </section>

    <section id="file-analysis">
        <h2>Codebase Evolution</h2>
        <div id="scrolly-2">
            <div id="file-story">
                </div>
            
            <div id="file-plot">
                <dl id="files"></dl>
            </div>
        </div>
    </section>

</body>
</html>
